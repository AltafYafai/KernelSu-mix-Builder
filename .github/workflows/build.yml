name: Build & Release KernelSu-mix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag in private source repo'
        required: true
        default: 'master'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v1.0.0, required if publishing release)'
        required: false
        default: ''

jobs:
  build:
    name: Build KernelSu-mix Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Source Repository
        uses: actions/checkout@v4
        with:
          repository: 'AltafYafai/KernelSu-mix'
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.event.inputs.ref || 'master' }}
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: Install Cross Compiler Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Configure Signing Credentials
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystores
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystores/release.p12
            
            # Write to both sign.properties and manager/gradle.properties
            cat <<EOF > manager/sign.properties
          KEYSTORE_FILE=../keystores/release.p12
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

            cat <<EOF >> manager/gradle.properties
          KEYSTORE_FILE=../keystores/release.p12
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "Configured production release keystore for Manager"
          fi

      - name: Build Native Zygisk Subsystem
        run: |
          mkdir -p userspace/zygisk/build
          cmake -B userspace/zygisk/build \
                -S userspace/zygisk \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28
          cmake --build userspace/zygisk/build -j$(nproc)
          
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a/
          cp userspace/zygisk/build/libzygisk.so manager/app/src/main/jniLibs/arm64-v8a/

      - name: Build Userspace Daemon (ksud)
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          cross build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
          
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a/
          cp userspace/ksud/target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build KernelSu-mix Manager APK
        working-directory: ./manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Package Output Artifacts
        run: |
          mkdir -p dist
          find manager/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} dist/KernelSu-mix-Manager.apk \;
          cp userspace/ksud/target/aarch64-linux-android/release/ksud dist/ksud-arm64
          cp userspace/zygisk/build/libzygisk.so dist/libzygisk-arm64.so
          cp userspace/zygisk/build/zygisk_injector dist/zygisk_injector-arm64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelSu-mix-Build-${{ github.sha }}
          path: dist/*

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: KernelSu-mix ${{ github.event.inputs.release_tag }}
          body: |
            ### KernelSu-mix Release ${{ github.event.inputs.release_tag }}
            
            **Included Features:**
            - Inbuilt Zygisk Runtime (API v4)
            - SUSFS Kernel Cloaking
            - Play Integrity Fix (PIF) Injection
            - Tricky Store & Strong Integrity Keybox Support
            - TEE Emulator (Broken TEE Bypass)
            - Play Store Detach Engine
            
            **Downloads:**
            - `KernelSu-mix-Manager.apk` - Management app
            - `ksud-arm64` - Userspace root daemon
            - `libzygisk-arm64.so` - Inbuilt Zygisk runtime
          files: dist/*
          draft: false
          prerelease: false
